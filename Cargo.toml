[package]
name = "F95_manager"
version = "1.8.0"
edition = "2024"

[features]
default = []
legacy-egui = ["dep:eframe"]

[dependencies]
clap = "4.5.45"
derive_more = {version = "2.0.1", features = ["full"]}
eframe = { version = "0.27", optional = true, default-features = false, features = ["wgpu", "glow", "default_fonts"] }
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "renderer-femtovg", "compat-1-2"] }
reqwest = { version = "0.12.23", features = ["json", "rustls-tls", "stream", "cookies"] }
serde = { version = "1.0.219", features = ["derive"] }
strum = {version = "0.27.2", features = ["derive"]}
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "full"] }
image = { version = "0.25.5", features = ["png", "jpeg", "webp", "gif"] }
lazy_static = "1.5.0"
serde_json = "1.0.142"
sha2 = "0.10.9"
regex = "1.11.1"
uuid = { version = "1", features = ["v4", "serde"] }
derive-getters = "0.5.0"
crossbeam-channel = "0.5.15"
log = "0.4"
env_logger = "0.11"
zip = { version = "7.0.0", default-features = false, features = ["deflate"] }
threadpool = "1.8"
bitflags = "2.6"
rfd = "0.14"
sevenz-rust = { version = "0.6.1", features = ["bzip2", "zstd", "aes", "cbc"] }
mega = "0.8.0"
futures = "0.3"
scraper = "0.24.0"
fluent-bundle = "0.15"
fluent-syntax = "0.11"
unic-langid = { version = "0.9", features = ["unic-langid-macros"] }
sys-locale = "0.3"
thiserror = "1.0"
intl-memoizer = "0.5"
once_cell = "1.19"
unrar = "0.5.8"
url = "2.5"
async-trait = "0.1"

dotenvy = "0.15"

[build-dependencies]
slint-build = "1.17.1"

# Keep the application debuggable while letting the CPU renderer run at speed.
[profile.dev.package.i-slint-renderer-software]
opt-level = 3

[profile.dev.package.i-slint-core]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package.i-slint-renderer-femtovg]
opt-level = 3

[profile.dev.package.femtovg]
opt-level = 3

[profile.release]
opt-level = 3
strip = true
lto = true
unrar = "0.5.8"
panic = "abort"

[build]
rustflags = ["-C", "link-arg=/STACK:8000000"]
