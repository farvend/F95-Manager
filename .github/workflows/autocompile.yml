name: Build

on:
  push:
    branches: [ "main", "codex/slint-ui" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly
        override: true
        components: rustfmt, clippy
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    
    - name: Build
      run: cargo build --release --verbose
    
    - name: Run tests
      run: cargo test --verbose
    
    - name: Get version from Cargo.toml
      id: cargo_version
      run: |
        $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Version found: $version"
      shell: pwsh
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: target/release/*.exe
        retention-days: 30
        
  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get version from Cargo.toml
      id: cargo_version
      run: |
        VERSION=$(grep "^version" Cargo.toml | sed 's/version = "\(.*\)"/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Version found: $VERSION"

    - name: Validate tag and release channel
      run: |
        set -e
        VERSION="${{ steps.cargo_version.outputs.VERSION }}"
        EXPECTED_TAG="v${VERSION}"

        if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
          echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
          exit 1
        fi

        git fetch origin \
          main:refs/remotes/origin/main \
          codex/slint-ui:refs/remotes/origin/codex/slint-ui \
          --no-tags

        if [[ "$VERSION" == *-* ]]; then
          RELEASE_BRANCH="origin/codex/slint-ui"
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "$EXPECTED_TAG must point to a Slint UI commit that is not already on main"
            exit 1
          fi
        else
          RELEASE_BRANCH="origin/main"
        fi

        if ! git merge-base --is-ancestor HEAD "$RELEASE_BRANCH"; then
          echo "$EXPECTED_TAG must point to a commit from $RELEASE_BRANCH"
          exit 1
        fi

        echo "Validated $EXPECTED_TAG against $RELEASE_BRANCH"
    
    - name: Check if release exists
      id: check_release
      run: |
        if gh release view "v${{ steps.cargo_version.outputs.VERSION }}" >/dev/null 2>&1; then
          echo "EXISTS=true" >> $GITHUB_OUTPUT
          echo "Release v${{ steps.cargo_version.outputs.VERSION }} already exists, skipping"
        else
          echo "EXISTS=false" >> $GITHUB_OUTPUT
          echo "Will create release v${{ steps.cargo_version.outputs.VERSION }}"
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get previous tag
      if: steps.check_release.outputs.EXISTS == 'false'
      id: prev_tag
      run: |
        # Получаем предыдущий тег
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
        if [ -z "$PREV_TAG" ]; then
          echo "No previous tag found, will include all commits"
        else
          echo "Previous tag: $PREV_TAG"
        fi
    
    - name: Generate changelog
      if: steps.check_release.outputs.EXISTS == 'false'
      id: changelog
      run: |
        echo "Generating changelog..."
        
        # Создаём файл для changelog
        echo "" > changelog.md
        
        # Если есть предыдущий тег, получаем коммиты после него
        if [ -n "${{ steps.prev_tag.outputs.PREV_TAG }}" ]; then
          echo "## 📋 Changes since ${{ steps.prev_tag.outputs.PREV_TAG }}" >> changelog.md
          echo "" >> changelog.md
          
          # Получаем коммиты между тегами (только сообщения коммитов)
          git log ${{ steps.prev_tag.outputs.PREV_TAG }}..HEAD --pretty=format:"- %s" --no-merges >> changelog.md
        else
          echo "## 📋 All Changes" >> changelog.md
          echo "" >> changelog.md
          
          # Получаем все коммиты (только сообщения коммитов)
          git log --pretty=format:"- %s" --no-merges >> changelog.md
        fi
        
        echo "" >> changelog.md
        
        # Сохраняем changelog в output
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        cat changelog.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        # Показываем в логах
        echo "Generated changelog:"
        cat changelog.md

    - name: Download artifact
      if: steps.check_release.outputs.EXISTS == 'false'
      uses: actions/download-artifact@v4
      with:
        name: windows-executable
        path: ./artifacts
    
    - name: Prepare release files
      if: steps.check_release.outputs.EXISTS == 'false'
      run: |
        mkdir release
        cp -r artifacts/* release/
        # Переименовываем exe файлы, добавляя версию
        cd release
        for file in *.exe; do
          if [ -f "$file" ]; then
            name="${file%.exe}"
            mv "$file" "${name}-v${{ steps.cargo_version.outputs.VERSION }}.exe"
          fi
        done
        cd ..

    - name: Build release body
      if: steps.check_release.outputs.EXISTS == 'false'
      env:
        CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        VERSION: ${{ steps.cargo_version.outputs.VERSION }}
      run: |
        set -e
        echo "<!-- Generated by CI from commit messages. -->" > release_body.md
        echo "" >> release_body.md
        if [[ "$VERSION" == *-* ]]; then
          echo "## 🎉 Slint UI Beta v$VERSION" >> release_body.md
        else
          echo "## 🎉 Release v$VERSION" >> release_body.md
        fi
        echo "" >> release_body.md
        printf "%s\n" "$CHANGELOG" >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "## 📦 Downloads" >> release_body.md
        echo "" >> release_body.md
        echo "### Windows" >> release_body.md
        echo "- **Windows executable** - Pre-built binary for Windows (x86_64)" >> release_body.md
        echo "" >> release_body.md
        echo "---" >> release_body.md
        echo "" >> release_body.md
        echo "## 📝 Installation" >> release_body.md
        echo "" >> release_body.md
        echo "### Windows" >> release_body.md
        echo "1. Download the \`.exe\` file" >> release_body.md
        echo "2. Place it in your desired directory" >> release_body.md
        echo "3. Run from command line or double-click" >> release_body.md
        echo "" >> release_body.md
        echo "### Build from source" >> release_body.md
        echo '\`\`\`bash' >> release_body.md
        echo 'cargo build --release' >> release_body.md
        echo '\`\`\`' >> release_body.md
    
    - name: Create Draft Release
      if: steps.check_release.outputs.EXISTS == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.cargo_version.outputs.VERSION }}
        name: ${{ contains(steps.cargo_version.outputs.VERSION, '-') && format('Slint UI Beta v{0}', steps.cargo_version.outputs.VERSION) || format('Release v{0}', steps.cargo_version.outputs.VERSION) }}
        body_path: release_body.md
        files: |
          release/*
        generate_release_notes: false
        draft: true
        prerelease: ${{ contains(steps.cargo_version.outputs.VERSION, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
